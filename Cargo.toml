[package]
name = "bls-encryption-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
blst = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Service
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }

# Performance
rayon = "1.8"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.8"
